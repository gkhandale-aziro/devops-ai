# alembic.ini — schema-migration config. The URL is resolved at runtime in
# alembic/env.py from AZIRO_DB_URL (or a SQLite fallback), so we don't
# hard-code it here.
[alembic]
script_location = alembic
prepend_sys_path = .
# Silences alembic ≥1.14 deprecation warning about implicit splitting.
path_separator = os
# Date-prefix so `ls versions/` sorts chronologically; Alembic still adds
# its own hash for collision safety.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# sourceless=false requires each version to have its .py source on disk —
# we commit the .py files and never ship .pyc-only migrations.
sourceless = false

# Empty placeholder — env.py overrides.
sqlalchemy.url = sqlite:///aziro.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
