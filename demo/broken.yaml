---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-store-worker
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-store
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-store
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-store
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: nginx:9.99.99-does-not-exist
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
