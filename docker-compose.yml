# Requires Docker Compose v2 CLI (`docker compose up`) — the
# `depends_on.condition: service_healthy` gate below is a v2 feature
# and is silently ignored by the legacy v1 `docker-compose` binary,
# which would race the app container against Redis startup.
services:
  aziro:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      # ── Persistent data (DB, targets, sessions, encryption key) ────────────

      - aziro-data:/app/data

      # ── Host credentials (read-only reference) ────────────────────────────
      # These are READ by cloud CLIs for auth. Live bind mounts — any change
      # on the host (aws configure, gcloud auth login, etc.) is instant.
      - ${HOME}/.aws:/home/aziro/.host-aws:ro
      - ${HOME}/.config/gcloud:/home/aziro/.host-gcloud:ro
      - ${HOME}/.azure:/home/aziro/.host-azure:ro
      - ${HOME}/.ssh:/home/aziro/.ssh:ro

      # ── Kubeconfig: host as seed, container writes its own ────────────────
      # Host kubeconfig mounted read-only for existing contexts.
      # Cloud setup commands (eks/gke/aks) write to /app/data/.kube/config
      # on the data volume. KUBECONFIG merges both.
      - ${HOME}/.kube:/home/aziro/.host-kube:ro

      # Docker socket — for managing Docker targets
      - /var/run/docker.sock:/var/run/docker.sock

      # Terraform workspaces — uncomment and adjust path
      # - /path/to/terraform:/tf:ro
    env_file:
      - .env
    environment:
      - AZIRO_DATA_DIR=/app/data
      - AZIRO_KEY_FILE=/app/data/.aziro_key
      # Merge host kubeconfig (read-only) + container kubeconfig (writable)
      - KUBECONFIG=/home/aziro/.host-kube/config:/app/data/.kube/config
      # Cloud CLIs read from host mounts
      - AWS_SHARED_CREDENTIALS_FILE=/home/aziro/.host-aws/credentials
      - AWS_CONFIG_FILE=/home/aziro/.host-aws/config
      - CLOUDSDK_CONFIG=/home/aziro/.host-gcloud
      - AZURE_CONFIG_DIR=/home/aziro/.host-azure
      # Ollama on host — reachable via host.docker.internal
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      # DB-2 — one URL powers flask-limiter + flask-session + monitor pub/sub.
      # AZIRO_SESSION_TYPE=redis flips Flask sessions to server-side storage;
      # leave unset for cookie-signed sessions (dev / no-redis deployments).
      - AZIRO_REDIS_URL=redis://redis:6379/0
      - AZIRO_SESSION_TYPE=redis
      # DB-3 — AZIRO_DB_URL lives in .env (loaded via env_file above) so the
      # password never appears in a tracked file. See .env.example for the
      # required value; compose up fails fast if the var is unset because
      # the aziro image refuses to boot against a bare SQLite when the
      # postgres container is the only DB reachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    restart: unless-stopped

  # DB-2 — Redis 7 for rate-limit counters, server-side sessions, and
  # monitor SSE pub/sub fan-out across gunicorn workers. Appendonly so
  # sessions + rate-limit windows survive a container restart. When the
  # app runs outside compose (dev / pytest) everything falls back to
  # in-memory / filesystem / in-process because AZIRO_REDIS_URL is unset.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aziro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # DB-3 — Postgres 16 for the durable application state (events, snapshots,
  # analyses, users, audit_log, ...). Only enabled when AZIRO_DB_URL is set
  # on the aziro service (default in this compose file). Dev / pytest boxes
  # that run outside compose keep the SQLite fallback because AZIRO_DB_URL
  # is unset there.
  #
  # Schema changes are owned by Alembic — run `python -m scripts.db upgrade`
  # against this instance, not `init-scripts`. pg-init.sql only lays down
  # extensions that must exist before the first migration applies.
  postgres:
    image: postgres:16-alpine
    # shared_preload_libraries is read at server startup, not at CREATE
    # EXTENSION time. Without this, pg-init.sql's `CREATE EXTENSION
    # pg_stat_statements` succeeds but every later query against the
    # pg_stat_statements view fails with SQLSTATE 55000. Pass via -c
    # here since postgres:alpine ships no postgresql.conf override path.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    # POSTGRES_PASSWORD comes from .env via env_file so the secret never
    # lives in a tracked file. POSTGRES_DB / POSTGRES_USER are non-sensitive
    # and stay in `environment:` for visibility.
    env_file:
      - .env
    environment:
      POSTGRES_DB: aziro
      POSTGRES_USER: aziro
    volumes:
      - aziro-pg-data:/var/lib/postgresql/data
      # Runs exactly once, on first boot against an empty data dir. Enabling
      # pg_stat_statements here (rather than via an Alembic migration) keeps
      # the migration pipeline Alembic-only — extensions require superuser
      # and shared_preload_libraries, which Alembic should not manage.
      - ./scripts/pg-init.sql:/docker-entrypoint-initdb.d/pg-init.sql:ro
    healthcheck:
      # pg_isready returns 0 once the server accepts connections. Gate the
      # aziro service on this so the first `alembic upgrade head` doesn't
      # race a still-booting Postgres.
      test: ["CMD-SHELL", "pg_isready -U aziro -d aziro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # DB-4 — MinIO object store holds the nightly pg_dump archives. S3 API
  # compatible so ops can swap to AWS S3 / Cloudflare R2 later by changing
  # MINIO_ENDPOINT in .env. `mc ready local` is the official liveness probe
  # (exit 0 when quorum is reached). Bucket + 30-day lifecycle rule are
  # created idempotently by ops/backup/minio-bucket-init.sh on every
  # backup-sidecar start, so a fresh volume is bootstrapped automatically.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aziro-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.aziro.logs: "true"
      com.aziro.service: "minio"
    restart: unless-stopped

  # DB-4 — Backup sidecar. Stays up (CMD=sleep infinity) so ofelia can
  # `docker exec` into it on schedule. Labels below are read by the
  # ofelia container to register two cron jobs:
  #   02:00 UTC — backup.sh (pg_dump → MinIO)
  #   02:30 UTC — restore-verify.sh (restore latest dump → diff schema)
  # On first boot against a fresh MinIO volume, the container also runs
  # minio-bucket-init.sh as a one-shot entrypoint so the bucket and
  # lifecycle rule exist before the first scheduled backup fires.
  backup:
    build: ./ops/backup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - aziro-backup-tmp:/tmp
    # Bootstrap bucket + lifecycle, then sleep so ofelia can exec us.
    command:
      - "sh"
      - "-c"
      - "minio-bucket-init.sh && exec sleep infinity"
    labels:
      com.aziro.logs: "true"
      com.aziro.service: "backup"
      # Ofelia picks these up automatically (see ofelia service below).
      # Cron format is 6-field (sec min hour dom mon dow) — ofelia extends
      # standard cron with a seconds column.
      ofelia.enabled: "true"
      ofelia.job-exec.backup.schedule: "0 0 2 * * *"
      ofelia.job-exec.backup.command: "/usr/local/bin/backup.sh"
      ofelia.job-exec.restore-verify.schedule: "0 30 2 * * *"
      ofelia.job-exec.restore-verify.command: "/usr/local/bin/restore-verify.sh"
    restart: unless-stopped

  # DB-4 — Ofelia scheduler. Reads docker labels on other containers in
  # daemon mode and invokes commands at cron-schedule time. Ran inside
  # the same compose project so no extra auth is needed — the mounted
  # docker.sock is the only privilege grant. Labels on the `backup`
  # service define the jobs; ofelia is otherwise stateless.
  ofelia:
    image: mcuadros/ofelia:0.3.22
    command: daemon --docker
    depends_on:
      backup:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      com.aziro.logs: "true"
      com.aziro.service: "ofelia"
    restart: unless-stopped

volumes:
  aziro-data:
  aziro-redis-data:
  aziro-pg-data:
  aziro-minio-data:
  aziro-backup-tmp:
