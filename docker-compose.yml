services:
  aziro:
    build: .
    # Labels picked up by Alloy (obs profile) to opt this container's
    # stdout/stderr into Loki. No effect when the obs profile is off.
    labels:
      com.aziro.logs: "true"
      com.aziro.service: "aziro"
    ports:
      - "5000:5000"
    volumes:
      # ── Persistent data (DB, targets, sessions, encryption key) ────────────

      - aziro-data:/app/data

      # ── Host credentials (read-only reference) ────────────────────────────
      # These are READ by cloud CLIs for auth. Live bind mounts — any change
      # on the host (aws configure, gcloud auth login, etc.) is instant.
      - ${HOME}/.aws:/home/aziro/.host-aws:ro
      - ${HOME}/.config/gcloud:/home/aziro/.host-gcloud:ro
      - ${HOME}/.azure:/home/aziro/.host-azure:ro
      - ${HOME}/.ssh:/home/aziro/.ssh:ro

      # ── Kubeconfig: host as seed, container writes its own ────────────────
      # Host kubeconfig mounted read-only for existing contexts.
      # Cloud setup commands (eks/gke/aks) write to /app/data/.kube/config
      # on the data volume. KUBECONFIG merges both.
      - ${HOME}/.kube:/home/aziro/.host-kube:ro

      # Docker socket — for managing Docker targets
      - /var/run/docker.sock:/var/run/docker.sock

      # Terraform workspaces — uncomment and adjust path
      # - /path/to/terraform:/tf:ro
    env_file:
      - .env
    environment:
      - AZIRO_DATA_DIR=/app/data
      - AZIRO_KEY_FILE=/app/data/.aziro_key
      # Merge host kubeconfig (read-only) + container kubeconfig (writable)
      - KUBECONFIG=/home/aziro/.host-kube/config:/app/data/.kube/config
      # Cloud CLIs read from host mounts
      - AWS_SHARED_CREDENTIALS_FILE=/home/aziro/.host-aws/credentials
      - AWS_CONFIG_FILE=/home/aziro/.host-aws/config
      - CLOUDSDK_CONFIG=/home/aziro/.host-gcloud
      - AZURE_CONFIG_DIR=/home/aziro/.host-azure
      # Ollama on host — reachable via host.docker.internal
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    restart: unless-stopped

  # ── Observability stack (opt-in) ────────────────────────────────────────────
  # Start with:  docker compose --profile obs up -d
  # Access:      Grafana at http://localhost:3000  (admin / admin — change on
  #              first login or set GF_SECURITY_ADMIN_PASSWORD in .env).
  # All three services are self-hosted; no telemetry leaves this machine.
  loki:
    image: grafana/loki:3.2.0
    profiles: ["obs"]
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./obs/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.2
    profiles: ["obs"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./obs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  aziro-data:
  loki-data:
  alloy-data:
  grafana-data:
