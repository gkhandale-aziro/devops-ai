<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aziro Ops</title>
    <!-- Plus Jakarta Sans — recommended by ui-ux-pro-max for SaaS dashboards -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* ── Brand ── */
        --c-accent:        #6366f1;
        --c-accent-dim:    #6366f122;
        --c-accent-hover:  #818cf8;
        --c-accent-glow:   0 0 16px #6366f144, 0 0 32px #6366f122;

        /* ── Backgrounds (OLED-optimised dark palette) ── */
        --c-bg-base:       #020617;
        --c-bg-surface:    #0a0f1e;
        --c-bg-raised:     #0f1629;
        --c-bg-overlay:    #182035;

        /* ── Borders ── */
        --c-border:        #1a2235;
        --c-border-strong: #263050;

        /* ── Text ── */
        --c-text-primary:  #f1f5f9;
        --c-text-secondary:#94a3b8;
        --c-text-muted:    #64748b;
        --c-text-faint:    #475569;

        /* ── Severity ── */
        --c-sev1:          #f43f5e;
        --c-sev1-bg:       #2a0011;
        --c-sev2:          #f59e0b;
        --c-sev2-bg:       #2a1a00;
        --c-sev3:          #06b6d4;
        --c-sev3-bg:       #0c2233;

        /* ── Status ── */
        --c-green:         #22c55e;
        --c-green-bg:      #052e16;
        --c-red:           #ef4444;
        --c-yellow:        #f59e0b;

        /* ── Spacing (8px grid) ── */
        --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
        --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;

        /* ── Radius ── */
        --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px;

        /* ── Typography ── */
        --fs-xs: 10px; --fs-sm: 11px; --fs-md: 13px;
        --fs-lg: 15px; --fs-xl: 18px;

        /* ── Elevation (shadows) ── */
        --shadow-sm:  0 1px 3px #00000044, 0 1px 2px #00000033;
        --shadow-md:  0 4px 16px #00000055, 0 2px 6px #00000033;
        --shadow-lg:  0 8px 32px #00000066, 0 4px 12px #00000044;
        --shadow-glow-accent: 0 0 20px #6366f133, 0 0 40px #6366f111;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--c-bg-base);
        color: var(--c-text-primary);
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        font-size: var(--fs-md);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #263050; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a4570; }

      /* ── Focus visible — keyboard accessibility ── */
      :focus-visible {
        outline: 2px solid var(--c-accent);
        outline-offset: 2px;
        border-radius: var(--r-sm);
      }
      :focus:not(:focus-visible) { outline: none; }

      /* ── Skip link — keyboard UX ── */
      .skip-link {
        position: fixed; top: -100%; left: 12px; z-index: 9999;
        background: var(--c-accent); color: #fff;
        padding: 8px 14px; border-radius: var(--r-md);
        font-size: 13px; font-weight: 600; text-decoration: none;
        transition: top .15s;
      }
      .skip-link:focus { top: 12px; }

      /* ── Skeleton loader ── */
      .skeleton {
        background: linear-gradient(90deg, #0f1629 25%, #182035 50%, #0f1629 75%);
        background-size: 200% 100%;
        animation: skeleton-sweep 1.6s ease-in-out infinite;
        border-radius: var(--r-sm);
      }

      /* ── Glow utilities ── */
      .glow-accent { box-shadow: var(--shadow-glow-accent); }
      .glow-green  { box-shadow: 0 0 16px #22c55e33, 0 0 32px #22c55e11; }
      .glow-red    { box-shadow: 0 0 16px #ef444433, 0 0 32px #ef444411; }

      /* ── Markdown content ── */
      .md h1,.md h2,.md h3 { color: var(--c-text-primary); margin: 14px 0 6px; font-weight: 700; line-height: 1.3; }
      .md h1 { font-size: 16px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; }
      .md p  { margin-bottom: 10px; line-height: 1.75; color: var(--c-text-secondary); }
      .md ul,.md ol { padding-left: 18px; margin-bottom: 10px; }
      .md li { margin-bottom: 4px; line-height: 1.7; color: var(--c-text-secondary); }
      .md code {
        background: #182035; color: #a5b4fc;
        padding: 1px 5px; border-radius: 3px;
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
        font-size: 12px;
      }
      .md pre {
        background: #060b16; border: 1px solid var(--c-border);
        border-radius: var(--r-md); padding: 14px; margin-bottom: 12px;
        overflow-x: auto;
      }
      .md pre code { background: none; color: #8b949e; padding: 0; font-size: 12px; }
      .md strong   { color: var(--c-text-primary); font-weight: 700; }
      .md em       { color: var(--c-text-secondary); font-style: italic; }
      .md blockquote { border-left: 3px solid var(--c-accent); padding-left: 10px; margin: 8px 0; color: var(--c-text-muted); }
      .md hr { border: none; border-top: 1px solid var(--c-border); margin: 14px 0; }
      .md a  { color: var(--c-accent-hover); text-decoration: none; }
      .md a:hover { text-decoration: underline; }

      /* ── Animations ── */
      @keyframes pulse          { 0%,100%{opacity:1} 50%{opacity:.35} }
      @keyframes spin           { to{transform:rotate(360deg)} }
      @keyframes fadeIn         { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slideUp        { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slideIn        { from{transform:translateX(100%)} to{transform:translateX(0)} }
      @keyframes skeleton-sweep { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
      @keyframes glow-pulse     { 0%,100%{box-shadow:0 0 12px #6366f133} 50%{box-shadow:0 0 24px #6366f166} }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          transition-duration: .01ms !important;
        }
      }

      /* ── Monospace for logs/code ── */
      .mono {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-C3UkmPna.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="root"></div>
  </body>
</html>
