<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aziro Ops</title>
    <style>
      :root {
        /* ── Brand ── */
        --c-accent:       #6366f1;
        --c-accent-dim:   #6366f122;
        --c-accent-hover: #818cf8;

        /* ── Backgrounds ── */
        --c-bg-base:      #0b0d14;
        --c-bg-surface:   #0f1219;
        --c-bg-raised:    #161b27;
        --c-bg-overlay:   #1e2235;

        /* ── Borders ── */
        --c-border:       #1e2235;
        --c-border-strong:#2d3555;

        /* ── Text ── */
        --c-text-primary: #e2e8f0;
        --c-text-secondary:#94a3b8;
        --c-text-muted:   #64748b;
        --c-text-faint:   #475569;

        /* ── Severity ── */
        --c-sev1:         #f43f5e;
        --c-sev1-bg:      #2a0011;
        --c-sev2:         #f59e0b;
        --c-sev2-bg:      #2a1a00;
        --c-sev3:         #06b6d4;
        --c-sev3-bg:      #0c2233;

        /* ── Status ── */
        --c-green:        #22c55e;
        --c-green-bg:     #0a2a1a;
        --c-red:          #ef4444;
        --c-yellow:       #f59e0b;

        /* ── Spacing (8px grid) ── */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;

        /* ── Radius ── */
        --r-sm:  4px;
        --r-md:  8px;
        --r-lg:  10px;

        /* ── Typography ── */
        --fs-xs:  10px;
        --fs-sm:  11px;
        --fs-md:  13px;
        --fs-lg:  15px;
        --fs-xl:  18px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--c-bg-base);
        color: var(--c-text-primary);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-size: var(--fs-md);
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2d3555; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3d4565; }

      /* ── Markdown content styles ── */
      .md h1,.md h2,.md h3 { color: var(--c-text-primary); margin: 14px 0 6px; font-weight: 600; line-height: 1.3; }
      .md h1 { font-size: 16px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; }
      .md p { margin-bottom: 10px; line-height: 1.75; color: var(--c-text-secondary); }
      .md ul,.md ol { padding-left: 18px; margin-bottom: 10px; }
      .md li { margin-bottom: 4px; line-height: 1.7; color: var(--c-text-secondary); }
      .md code { background: #1e2235; color: #a5b4fc; padding: 1px 5px; border-radius: 3px; font-family: 'Cascadia Code','Consolas',monospace; font-size: 12px; }
      .md pre { background: #0d1117; border: 1px solid var(--c-border); border-radius: var(--r-md); padding: 12px; margin-bottom: 12px; overflow-x: auto; }
      .md pre code { background: none; color: #8b949e; padding: 0; font-size: 12px; }
      .md strong { color: var(--c-text-primary); font-weight: 600; }
      .md em { color: var(--c-text-secondary); font-style: italic; }
      .md blockquote { border-left: 3px solid var(--c-accent); padding-left: 10px; margin: 8px 0; color: var(--c-text-muted); }
      .md hr { border: none; border-top: 1px solid var(--c-border); margin: 14px 0; }
      .md a { color: var(--c-accent-hover); text-decoration: none; }
      .md a:hover { text-decoration: underline; }

      @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.3} }
      @keyframes spin    { to{transform:rotate(360deg)} }
      @keyframes fadeIn  { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
      @keyframes shimmer { 0%{opacity:.4} 50%{opacity:.8} 100%{opacity:.4} }
    </style>
    <script type="module" crossorigin src="/assets/index-FbpzAXBa.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
