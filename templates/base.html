<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aziro Ops{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body          { background:#0f1117; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; }
    .navbar       { background:#1a1d27 !important; border-bottom:1px solid #2d3148; }
    .navbar-brand { color:#7c8cf8 !important; font-weight:700; letter-spacing:.5px; }
    .nav-link     { color:#94a3b8 !important; }
    .nav-link.active, .nav-link:hover { color:#7c8cf8 !important; }
    .card         { background:#1a1d27; border:1px solid #2d3148; }
    .card-header  { background:#22263a; border-bottom:1px solid #2d3148; font-weight:600; }
    .badge-l1     { background:#0e7490; }
    .badge-l2     { background:#b45309; }
    .badge-l3     { background:#be123c; }
    .alert-l1     { border-left:3px solid #06b6d4; background:#0c2233; }
    .alert-l2     { border-left:3px solid #f59e0b; background:#2a1a00; }
    .alert-l3     { border-left:3px solid #f43f5e; background:#2a0011; }
    pre           { background:#0d1117; color:#c9d1d9; border-radius:6px;
                    padding:12px; font-size:.8rem; white-space:pre-wrap; }
    .btn-primary  { background:#4f46e5; border-color:#4f46e5; }
    .btn-primary:hover { background:#6366f1; border-color:#6366f1; }
    .stat-box     { background:#22263a; border-radius:8px; padding:16px; text-align:center; }
    .stat-num     { font-size:2rem; font-weight:700; }
    .text-muted   { color:#64748b !important; }
    ::-webkit-scrollbar       { width:6px; }
    ::-webkit-scrollbar-track { background:#1a1d27; }
    ::-webkit-scrollbar-thumb { background:#2d3148; border-radius:3px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg px-3">
  <a class="navbar-brand" href="/">⚡ Aziro Ops</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/alerts' %}active{% endif %}" href="/alerts">Alerts</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/history' %}active{% endif %}" href="/history">History</a></li>
    </ul>
  </div>
</nav>
<div class="container-fluid py-3">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
